[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "benchbro"
version = "1.0.0"
description = "Benchmark library and CLI"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Pete Daly" }]
keywords = [
    "benchmarking",
    "benchmark",
    "performance",
    "profiling",
    "microbenchmark",
    "latency",
    "throughput",
    "regression-testing",
    "performance-testing",
    "python",
    "cli",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
]
urls = { Repository = "https://github.com/peter-daly/benchbro", Documentation = "https://peter-daly.github.io/benchbro/" }
dependencies = [
    "rich",
    "tomli; python_version < '3.11'",
]

[project.optional-dependencies]
pytest = ["pytest>=8"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "ty",
    "deptry",
    "pre-commit",
    "yamllint",
    "tox",
    "mkdocs-material",
    "mkdocstrings[python]",
]

[project.scripts]
benchbro = "benchbro.cli:main"

[tool.hatch.build.targets.sdist]
artifacts = [".library-skills"]

[tool.hatch.build.targets.wheel.force-include]
".library-skills" = "benchbro/.agents/skills"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=benchbro --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
branch = true
source = ["benchbro"]
omit = ["benchbro/__main__.py"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
show_missing = true
skip_covered = true
fail_under = 90

[tool.ruff.lint]
ignore = ["TRY004"]


[tool.benchbro.ini_options]
benchmark_paths = ["examples"]
