name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: 0.12.7

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Run repository checks
        run: uv run pre-commit run --all-files

      - name: Check runtime dependencies for vulnerabilities
        run: |
          uv export \
            --frozen \
            --no-dev \
            --no-emit-project \
            --format requirements-txt \
            --output-file "${RUNNER_TEMP}/requirements.txt"
          uvx --from pip-audit==2.10.1 pip-audit \
            --requirement "${RUNNER_TEMP}/requirements.txt" \
            --no-deps \
            --disable-pip

      - name: Build distributions
        run: |
          uv build
          uvx --from twine==7.0.0 twine check dist/*

      - name: Smoke-test installed wheel
        run: |
          uv venv --python 3.13 "${RUNNER_TEMP}/benchbro-smoke"
          uv pip install \
            --python "${RUNNER_TEMP}/benchbro-smoke/bin/python" \
            dist/*.whl
          "${RUNNER_TEMP}/benchbro-smoke/bin/benchbro" --help
          "${RUNNER_TEMP}/benchbro-smoke/bin/python" -m benchbro --help

      - name: Run end-to-end benchmark example
        run: make examples

  tox:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            tox-env: py310
          - python-version: "3.11"
            tox-env: py311
          - python-version: "3.12"
            tox-env: py312
          - python-version: "3.13"
            tox-env: py313
          - python-version: "3.14"
            tox-env: py314
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install tox
        run: uv sync --frozen --all-groups

      - name: Test installed wheel
        run: uv run tox -e ${{ matrix.tox-env }}
